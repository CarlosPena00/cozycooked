name: Deploy to GitHub Pages

# The game is plain static files (no build step), so this only copies what the browser needs into
# the Pages artifact. Paths are all relative, so it works under the /<repo>/ sub-path as-is.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Version the modules with the commit
        # Every deploy gets fresh ?v= URLs (the short sha), so browsers never mix old and new modules.
        run: python3 tools/bump_version.py "${GITHUB_SHA::7}"
      - name: Collect the site files
        # DESIGN.md and tools/ stay out of the published site.
        run: |
          mkdir _site
          cp -r index.html style.css src assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
